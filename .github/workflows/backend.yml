name: backend

# ADR-004의 path 필터. 백엔드가 바뀌지 않은 커밋은 이 워크플로를 아예 돌리지 않는다.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Dockerfile의 Lambda base 이미지와 같은 버전으로 맞춘다.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # OIDC로 AWS에 인증한다. 장기 액세스 키를 저장소에 두지 않기 위함이다.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 러너는 x86인데 이미지는 arm64다(ADR-003). buildx의 기본 docker 드라이버는
      # 다른 아키텍처로 빌드하지 못하므로, QEMU를 등록하고 컨테이너 드라이버
      # 빌더를 띄운다. 이 두 줄이 없으면 첫 배포가 빌드 단계에서 멈춘다.
      #
      # 저장소가 public이면 `runs-on: ubuntu-24.04-arm`으로 바꿔 네이티브로
      # 빌드하는 편이 더 빠르다. 그 경우 아래 두 단계는 필요 없다.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          # Lambda는 ARM64로 돈다(ADR-003). 러너는 x86이므로 buildx로 교차 빌드한다.
          docker buildx build --platform linux/arm64 --provenance=false \
            -t "$IMAGE" --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "$IMAGE"
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      - name: Smoke test the deployed function
        run: |
          # 배포 직후 콜드 스타트를 한 번 태워, 실패를 사용자보다 먼저 만난다.
          curl --fail --silent --show-error --max-time 30 \
            "${{ vars.API_BASE_URL }}/api/health"
