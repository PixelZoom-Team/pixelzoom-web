name: frontend

on:
  # 코드를 바꾸지 않고도 다시 돌릴 수 있게 열어 둔다. 배포가 외부 사정으로
  # 실패했을 때(자격 증명 미설정, 일시적 오류) 빈 커밋을 만들지 않아도 된다.
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 이상이어야 한다. 로케일 검사 스크립트가 package.json에 type이
          # 없는 .js를 ESM으로 불러오는데, 그 자동 감지가 22부터 기본이다.
          # E2E도 내장 WebSocket을 쓰므로 같은 하한을 요구한다.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check locale parity
        # 빠진 번역은 화면에서 영어로 조용히 폴백되므로 눈으로는 잡히지 않는다.
        working-directory: .
        run: node scripts/check-locales.mjs

      - name: Build
        env:
          # CRA는 빌드 시점에 값을 번들에 박아 넣는다. 런타임 주입이 불가능하므로
          # 환경별로 다시 빌드해야 한다.
          REACT_APP_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3
        if: github.event_name != 'pull_request'
        run: |
          # 해시가 박힌 정적 자산은 오래 캐시해도 안전하다.
          aws s3 sync build/static "s3://${{ vars.S3_BUCKET }}/static" \
            --delete --cache-control "public,max-age=31536000,immutable"
          # index.html은 절대 캐시하면 안 된다. 배포해도 옛 번들을 가리키게 된다.
          aws s3 sync build "s3://${{ vars.S3_BUCKET }}" \
            --delete --exclude "static/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
